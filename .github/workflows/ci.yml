name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@latest --activate

      - name: Cache pnpm dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check new packages are bootstrapped on npm
        run: node scripts/check-publishable.mjs

      - name: Build packages
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Build Storybook (autotel-devtools)
        run: pnpm turbo run build-storybook --filter=autotel-devtools

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Install Playwright browsers
        run: |
          pnpm --filter @jagreehal/example-playwright-e2e exec playwright install --with-deps chromium
          pnpm --filter autotel-devtools exec playwright install --with-deps chromium

      - name: Run tests
        run: pnpm test
        env:
          NODE_ENV: test

  mongoose-integration:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@latest --activate

      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: '8.0'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Mongoose integration tests
        # Through turbo, so the workspace packages it imports are built first.
        # `pnpm --filter ... run` calls the script directly and skips that.
        run: pnpm turbo run test:integration --filter=autotel-mongoose
        env:
          # Against the server above, rather than downloading an in-memory one.
          MONGO_TEST_URI: mongodb://127.0.0.1:27017

  dependabot-auto-merge:
    needs: [build-and-test, mongoose-integration]
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: '${{ secrets.GITHUB_TOKEN }}'

      - name: Auto-merge Dependabot PRs
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
