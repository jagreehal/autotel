name: Release

on:
  push:
    branches:
      - main
  # Recovery hatch. A missed push webhook (an Actions incident, a throttled
  # event) leaves changesets stranded: main carries a changeset, no run exists
  # to consume it, and GitHub does not replay the event. Without this the only
  # way back is an empty commit. The `release` environment still gates the
  # publish, so this grants no ability a push does not already have.
  workflow_dispatch:

# Default-deny: the workflow itself gets no write scopes.
# Only the publish job below is granted the tokens it needs.
permissions:
  contents: read

jobs:
  # Opens or updates the "chore: release packages" PR. No publish, no OIDC
  # token, so no environment: every push that adds a changeset refreshes the
  # PR within minutes. Gating this job behind the reviewer left the PR stale
  # for as long as a run waited for approval, and the concurrency group queued
  # every later push behind it.
  version:
    name: Version
    runs-on: ubuntu-latest
    # Never run in a fork or under another owner.
    if: github.repository_owner == 'jagreehal'
    # Its own group: a publish waiting for approval never holds this one up.
    concurrency: release-version-${{ github.ref }}
    permissions:
      contents: write # changesets: push the release branch
      pull-requests: write # changesets: open the "Version Packages" PR
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update the release pull request
        id: changesets
        uses: changesets/action@3841a0683d3cfa6dae0f9bb335290003010fe3f0 # v1.9.0
        with:
          version: pnpm version-packages
          commit: 'chore: release packages'
          title: 'chore: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Runs only once no changesets remain, i.e. the release PR was merged.
  publish:
    name: Publish
    needs: version
    if: needs.version.outputs.hasChangesets == 'false'
    # Queued, never cancelled, so a publish is never cut off part-way.
    concurrency: release-publish-${{ github.ref }}
    runs-on: ubuntu-latest
    # Pairs with the npm trusted-publisher "Environment name = release" setting.
    # GitHub only grants this environment to jobs that satisfy the environment's
    # rules (deployment branch restricted to main + required reviewer), so a
    # workflow running from any other branch cannot obtain the OIDC claim npm
    # requires, and the publish is rejected. Releases can only originate from
    # the protected release path.
    environment: release
    permissions:
      contents: write # changesets: tags, GitHub release
      pull-requests: write # changesets: comment on released PRs
      id-token: write # OIDC trusted publishing / provenance — scoped to THIS job only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC trusted publishing
        run: npx npm@11 install -g npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish to npm
        uses: changesets/action@3841a0683d3cfa6dae0f9bb335290003010fe3f0 # v1.9.0
        with:
          publish: pnpm release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
