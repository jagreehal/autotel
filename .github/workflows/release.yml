name: Release

on:
  push:
    branches:
      - main
  # Recovery hatch. A missed push webhook (an Actions incident, a throttled
  # event) leaves changesets stranded: main carries a changeset, no run exists
  # to consume it, and GitHub does not replay the event. Without this the only
  # way back is an empty commit. The `release` environment still gates the
  # publish, so this grants no ability a push does not already have.
  workflow_dispatch:

# Default-deny: the workflow itself gets no write scopes.
# Only the publish job below is granted the tokens it needs.
permissions:
  contents: read

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # Never run in a fork or under another owner.
    if: github.repository_owner == 'jagreehal'
    # Pairs with the npm trusted-publisher "Environment name = release" setting.
    # GitHub only grants this environment to jobs that satisfy the environment's
    # rules (deployment branch restricted to main + required reviewer), so a
    # workflow running from any other branch cannot obtain the OIDC claim npm
    # requires, and the publish is rejected. Releases can only originate from
    # the protected release path.
    environment: release
    permissions:
      contents: write # changesets: version commit, tags, GitHub release
      pull-requests: write # changesets: open the "Version Packages" PR
      id-token: write # OIDC trusted publishing / provenance — scoped to THIS job only
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Upgrade npm for OIDC trusted publishing
        run: npx npm@11 install -g npm@11

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@latest --activate

      - name: Cache pnpm dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@3841a0683d3cfa6dae0f9bb335290003010fe3f0 # v1.9.0
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: 'chore: release packages'
          title: 'chore: release packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
