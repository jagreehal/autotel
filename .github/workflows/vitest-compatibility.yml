name: Vitest Compatibility

on:
  push:
    branches:
      - main
    paths:
      - 'packages/autotel/**'
      - 'packages/autotel-vitest/**'
      - '.github/workflows/vitest-compatibility.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'packages/autotel/**'
      - 'packages/autotel-vitest/**'
      - '.github/workflows/vitest-compatibility.yml'

jobs:
  vitest-compat:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install pnpm
        run: corepack prepare pnpm@10.27.0 --activate

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build autotel packages used by integration test
        run: |
          pnpm --filter autotel build
          pnpm --filter autotel-vitest build

      # Runs against the workspace's own Vitest (^4.1.10), so the version under
      # test follows package.json instead of drifting from a pinned list here.
      - name: Run autotel-vitest integration tests
        run: pnpm --filter autotel-vitest test:compat
        env:
          NODE_ENV: test
