apiVersion: 'v3.2.0'
kind: 'DataContract'
id: 'customers'
name: 'Customers'
version: '1.0.0'
status: 'active'

schema:
  - name: 'customers'
    physicalType: 'TABLE'
    description: 'All customers holding a life insurance policy since 2020-01-01'
    quality:
      - type: 'sql'
        description: 'Expect at least 3 rows'
        query: 'select count(*) from customers'
        mustBeGreaterOrEqualTo: 3
    properties:
      - name: 'customer_id'
        logicalType: 'string'
        description: 'Customer identifier'
        primaryKey: true
        quality:
          - metric: 'duplicateValues'
            mustBe: 0
      - name: 'customer_name'
        businessName: 'Customer Name'
        logicalType: 'string'
        physicalType: 'VARCHAR(100)'
        required: true
        classification: 'restricted'
        tags: ['pii:true']
        quality:
          - type: 'sql'
            description: 'Expect less than 1% empty name fields'
            query: |
              SELECT AVG(CASE WHEN customer_name IS NULL OR TRIM(customer_name) = '' THEN 1 ELSE 0 END)
              FROM customers
            mustBeLessThan: 0.01
      - name: 'annual_premium'
        logicalType: 'integer'
        physicalType: 'INTEGER'
        description: 'Annual premium in cents'
        required: true
        logicalTypeOptions:
          minimum: 0
      - name: 'customer_status'
        logicalType: 'string'
        physicalType: 'TEXT'
        quality:
          - type: 'library'
            description: 'Only valid customer statuses'
            metric: 'invalidValues'
            arguments:
              validValues: ['active', 'lapsed', 'cancelled']
            mustBe: 0
      - name: 'last_updated_at'
        logicalType: 'timestamp'
        physicalType: 'TIMESTAMP'
        description: 'Timestamp of the last update to the customer record'

slaProperties:
  - property: 'retention'
    value: 5
    unit: 'year'
  - property: 'freshness'
    value: 24
    unit: 'hours'
    element: 'customers.last_updated_at'
